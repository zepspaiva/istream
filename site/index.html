<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Couchwire Coming Soon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Couchwire makes your TV a screen again. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. A switched-off TV panel fills the page; the logo and line sit where the picture would be. */
:root {
  --bg: #06080b;         /* a screen that is off */
  --glass: #0c1015;
  --ink: #eef1f5;
  --muted: #8a94a1;
  --line: #1d232c;
  --led: #ff4a3d;        /* the standby light */
  --glow: #7fb6d1;       /* first light on a waking screen */
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Schibsted Grotesk", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
  overflow-x: hidden;
}
:focus-visible { outline: 2px solid var(--led); outline-offset: 3px; border-radius: 8px; }

.stage {
  flex: 1; display: grid; place-items: center; position: relative;
  padding-block: 48px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}
/* the panel: a faint 16:9 bezel with light rising inside it */
.panel {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(1100px, 94vw); aspect-ratio: 16 / 9; max-width: 100%;
  border: 1px solid var(--line); border-radius: 18px; pointer-events: none; overflow: hidden;
  background: radial-gradient(70% 60% at 50% 55%, rgba(127,182,209,.10), transparent 70%), var(--glass);
}
.panel::before { /* the line a screen draws as it switches on */
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--glow), transparent);
  opacity: .0; animation: line 1.6s .3s ease-out both;
}
.panel::after { /* standby light, bottom right of the bezel */
  content: ""; position: absolute; right: 18px; bottom: 14px; width: 6px; height: 6px; border-radius: 50%;
  background: var(--led); box-shadow: 0 0 12px var(--led);
  animation: standby 2.4s ease-in-out infinite;
}
@media (max-width: 640px) {
  .panel { width: 140vw; aspect-ratio: 9 / 16; width: 92vw; }
}

.content { position: relative; display: grid; justify-items: center; text-align: center; gap: 28px; max-width: 640px; }
.content > * { min-width: 0; }

.logo { display: flex; align-items: center; gap: 14px; }
.logo svg { width: 64px; height: 52px; flex: none; }
.wordmark { font-family: var(--display); font-weight: 800; font-size: 34px; letter-spacing: -0.035em; line-height: 1; }

h1 {
  font-family: var(--display); font-weight: 800; margin: 0; text-wrap: balance;
  font-size: clamp(44px, 8.4vw, 96px); line-height: .96; letter-spacing: -0.04em;
}
h1 .screen { position: relative; white-space: nowrap; }
h1 .screen::after { /* a picture fades up under one word */
  content: ""; position: absolute; left: -2%; right: -2%; bottom: .08em; height: .14em; border-radius: 4px;
  background: linear-gradient(90deg, var(--glow), #f0c27a);
  transform-origin: left; animation: underline 1s 1.2s ease-out both;
}
.tease { color: var(--muted); font-size: 19px; max-width: 34ch; text-wrap: pretty; margin: 0; }

form { display: flex; gap: 8px; width: min(100%, 440px); padding: 6px; border: 1px solid var(--line); border-radius: 999px; background: rgba(6,8,11,.7); }
input {
  flex: 1; min-width: 0; font: 400 16px/1.2 var(--body); padding: 12px 14px; border: 0; background: transparent; color: var(--ink);
}
input::placeholder { color: #5f6875; }
input:focus { outline: none; }
form:focus-within { border-color: #3a4452; }
button {
  font: 600 15px/1 var(--body); padding: 12px 18px; border-radius: 999px; border: 0; cursor: pointer;
  background: var(--ink); color: var(--bg); white-space: nowrap;
}
button:hover { background: var(--led); color: #fff; }
.msg { min-height: 1.5em; font-size: 15px; color: var(--muted); margin: -16px 0 0; }

.soon { font: 500 12px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: inline-flex; align-items: center; gap: 10px; }
.soon::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--led); box-shadow: 0 0 10px var(--led); }

footer {
  position: relative; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  padding-block: 20px 24px; font: 400 12px/1.4 var(--mono); color: #5f6875; letter-spacing: .04em;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

@keyframes line { 0% { opacity: 0; transform: scaleX(0); } 40% { opacity: 1; transform: scaleX(1); } 100% { opacity: 0; transform: scaleX(1) scaleY(60); } }
@keyframes underline { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes standby { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes draw { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
.logo .wire { stroke-dasharray: 60; animation: draw 1s .2s ease-out both; }
@media (prefers-reduced-motion: reduce) {
  .panel::before { display: none; }
  .panel::after, h1 .screen::after, .logo .wire { animation: none; }
}
@media (max-width: 480px) {
  form { flex-direction: column; border-radius: 18px; }
  button { padding: 14px 18px; }
  .wordmark { font-size: 28px; }
  .logo svg { width: 54px; height: 44px; }
}
</style>
</head>
<body>

<main class="stage">
  <div class="panel" aria-hidden="true"></div>
  <div class="content">
    <div class="logo" aria-label="Couchwire">
      <svg viewBox="0 0 64 52" aria-hidden="true">
        <rect x="3" y="3" width="46" height="31" rx="6" fill="none" stroke="#eef1f5" stroke-width="4.5"/>
        <path d="M26 36 V42 M17 44 H35" fill="none" stroke="#eef1f5" stroke-width="4" stroke-linecap="round"/>
        <path class="wire" d="M51 18 C58 18, 58 30, 58 39" fill="none" stroke="#eef1f5" stroke-width="3.2" stroke-linecap="round"/>
        <circle cx="58" cy="44" r="4" fill="#ff4a3d"/>
      </svg>
      <span class="wordmark">couchwire</span>
    </div>

    <h1>Make your TV a <span class="screen">screen</span> again.</h1>
    <p class="tease">No cluttered menus. No ads before your show. No hunting for the remote. Just a great picture, doing what it does best.</p>

    <form id="notify" novalidate>
      <label for="notify-email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Email</label>
      <input id="notify-email" name="email" type="email" autocomplete="email" placeholder="Your email" required>
      <button type="submit">Tell me first</button>
    </form>
    <p class="msg" id="notify-msg" role="status" aria-live="polite"></p>

    <span class="soon">Coming soon</span>
  </div>
</main>

<footer>
  <span>couchwire.io</span>
  <span>One email when it's ready. Nothing else.</span>
</footer>

<script>
  // Set this to a form endpoint (any waitlist or form service that accepts a POST) before going live.
  var NOTIFY_ENDPOINT = "";

  (function () {
    var form = document.getElementById("notify");
    var msg = document.getElementById("notify-msg");
    var email = document.getElementById("notify-email");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (!email.value || !email.checkValidity()) {
        msg.textContent = "Enter an email address like name@example.com.";
        email.focus();
        return;
      }
      if (!NOTIFY_ENDPOINT) {
        msg.textContent = "Sign-ups open soon. Nothing was sent yet.";
        return;
      }
      msg.textContent = "Sending…";
      fetch(NOTIFY_ENDPOINT, { method: "POST", body: new FormData(form), headers: { "Accept": "application/json" } })
        .then(function (r) {
          if (!r.ok) throw new Error(r.status);
          msg.textContent = "You're on the list. We'll write once, when it's ready.";
          form.reset();
        })
        .catch(function () {
          msg.textContent = "That didn't go through. Check your connection and try again.";
        });
    });
  })();
</script>
</body>
</html>
