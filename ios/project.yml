# The Xcode project is generated from this file:  brew install xcodegen  (once), then  cd ios && xcodegen
# iStream.xcodeproj is not in git: regenerate it after pulling.
name: iStream
options:
  bundleIdPrefix: com.zepspaiva
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  FreeMyTVKit:
    path: FreeMyTVKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  iStream:
    type: application
    platform: iOS
    sources:
      - path: iStream
    dependencies:
      - package: FreeMyTVKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ISTREAM_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: iStream
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "iStream talks to your Pi and your TV on the home network."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: iStream/Info.plist
      properties:
        NSAppTransportSecurity:
          # The Pi is plain HTTP on the home network; add-on artwork can be http too.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
schemes:
  iStream:
    build:
      targets:
        iStream: all
    run:
      config: Debug
    archive:
      config: Release
