# The Xcode project is generated from this file:  brew install xcodegen  (once), then  cd ios && xcodegen
# Couchwire.xcodeproj is not in git: regenerate it after pulling.
name: Couchwire
options:
  bundleIdPrefix: com.zeeh
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  CouchwireKit:
    path: CouchwireKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Couchwire:
    type: application
    platform: iOS
    sources:
      - path: Couchwire
      - path: Shared
    dependencies:
      - package: CouchwireKit
      - target: CouchwireWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COUCHWIRE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Couchwire
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Couchwire finds your TV and talks to it on the home network."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    info:
      path: Couchwire/Info.plist
      properties:
        NSBonjourServices:
          - _airplay._tcp
        NSAppTransportSecurity:
          # The TV is plain HTTP and WebSocket on the home network; add-ons and their artwork can be http too.
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
  CouchwireWidgets:
    # The Live Activity (Lock Screen and Dynamic Island); widgets later.
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(COUCHWIRE_BUNDLE_ID).widgets
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Couchwire
        SKIP_INSTALL: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Widgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Couchwire:
    build:
      targets:
        Couchwire: all
    run:
      config: Debug
    archive:
      config: Release
